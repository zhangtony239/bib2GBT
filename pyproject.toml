[project]
name = "bib2gbt"
version = "0.1.0"
description = "Convert BibTeX references to GB/T 7714 style ([J]/[D]/[C]/[N] etc.)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bib2gbt = "bib2GBT:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["bib2GBT"]
